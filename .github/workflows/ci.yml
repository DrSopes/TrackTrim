name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-import:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify import
        run: |
          python -c "import tracktrim; print(tracktrim.__version__)"